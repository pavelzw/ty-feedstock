# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.80"

package:
  name: ty
  version: ${{ version }}

source:
  # this also contains the ruff source code in contrast to https://github.com/astral-sh/ty/archive/refs/tags/${{ version }}.tar.gz
  url: https://github.com/astral-sh/ty/releases/download/${{ version }}/source.tar.gz
  sha256: a039d7e66d362e1707fc494f2c69dfdd2eb5333dc8fa9ad582edc125932fa5fa

build:
  number: 0
  script:
    env:
      JEMALLOC_SYS_WITH_LG_PAGE: ${{ '16' if (aarch64 or ppc64le) else '' }}
    content:
      # Tell `pixi global` to not set CONDA_PREFIX during activation
      # https://pixi.sh/dev/global_tools/introduction/#opt-out-of-conda_prefix
      - if: win
        then:
          - if not exist "%PREFIX%\\etc\\pixi" mkdir "%PREFIX%\\etc\\pixi\\ty"
          - type nul > "%PREFIX%\\etc\\pixi\\ty\\global-ignore-conda-prefix"
        else:
          - mkdir -p "${PREFIX}/etc/pixi/ty"
          - touch "${PREFIX}/etc/pixi/ty/global-ignore-conda-prefix"
      # rust-lld cannot handle some ppc64le relocations emitted by the jemalloc
      # C sources, so fall back to the bfd linker there
      - if: target_platform == "linux-ppc64le"
        then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS:-} -C link-arg=-fuse-ld=bfd"
      # `zip` (with the `zstd` feature) is a build dependency of `ty_vendored`, so cargo
      # compiles the `zstd-sys` C sources for the build platform too. cc-rs accumulates
      # the flags of `CFLAGS` into both compiles, which makes the build platform compiler
      # choke on the target's `-mcpu=power8` / `-mabi=lp64d`. Pass them via `TARGET_CFLAGS`
      # instead, which cc-rs only applies to the target compile.
      - if: build_platform != target_platform
        then:
          - export TARGET_CFLAGS="${CFLAGS}"
          - unset CFLAGS
      - cd ruff/crates/ty
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ../../../THIRDPARTY.yml
      - if: unix
        then:
          - mkdir -p $PREFIX/share/zsh/site-functions $PREFIX/share/bash-completion/completions $PREFIX/share/fish/vendor_completions.d
          - $PREFIX/bin/ty generate-shell-completion zsh > $PREFIX/share/zsh/site-functions/_ty
          - $PREFIX/bin/ty generate-shell-completion bash > $PREFIX/share/bash-completion/completions/ty
          - $PREFIX/bin/ty generate-shell-completion fish > $PREFIX/share/fish/vendor_completions.d/ty.fish

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    # only needed to build the vendored jemalloc, which is not used on Windows
    - if: unix
      then: make

tests:
  - package_contents:
      bin:
        - ty
      files:
        - etc/pixi/ty/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_ty
            - share/bash-completion/completions/ty
            - share/fish/vendor_completions.d/ty.fish
      strict: true
  - script:
      - ty --help
      - ty --version

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: An extremely fast Python type checker and language server, written in Rust.
  homepage: https://github.com/astral-sh/ty
  documentation: https://docs.astral.sh/ty
  repository: https://github.com/astral-sh/ty

extra:
  recipe-maintainers:
    - pavelzw
